# =============================================================================
# 实时行情推送（B5）
#   SDK 的 market_push 只有 connect/subscribe/heartbeat，没有重连/去重/时间戳校验；
#   本工程在 market/feed.py 里补齐，并在此配置。
#   * enabled=false 时不接推送，开仓不依赖推送（paper 模拟盘默认如此）
#   * 真实推送需要开放平台行情权限 + ws 地址，未取得凭证前保持 false
# =============================================================================
market_feed:
  enabled: false
  url: ""                       # 例：wss://<gateway>/msg/v1/push
  topics: ["qt"]
  codes: []                     # 留空则订阅 universe 中的标的
  # 启用推送后：行情不新鲜 / 连接断开 时禁止新开仓（已有持仓的止损不受影响）
  required_for_entry: true
  enforce_markets: ["cn"]
  heartbeat_timeout_seconds: 10
  stale_after_seconds: 5
  reconnect_initial_seconds: 0.2
  reconnect_max_seconds: 5
  max_reconnect_attempts: 0     # 0 = 无限重连
  settle_updates: 1             # 重连后需收到几条新行情才认为数据可信

# =============================================================================
# US-P2 / P3 能力开关（2026-11-16）
# -----------------------------------------------------------------------------
# 设计：默认 enabled: false —— 保证既有 P0/P1 行为与全部回归测试不受影响。
# 开启后**必须**由调用方注入对应组件（MarketStatusService / ShortGuard /
# SettlementLedger / BrokerCapabilities），缺任何一个都会 fail-closed（拒绝下单），
# 不允许"半接入"冒充已生效。
# =============================================================================
us_phase2:

  enabled: false

  # 分项开关（enabled=true 时逐项生效）
  checks:
    market_status: true      # 停牌 / LULD / MWCB（P2-C）
    order_policy: true       # 订单类型 / TIF / 券商能力（P2-B）
    short: true              # 卖空 / 借券 / SSR（P2-D）
    settlement: true         # T+1 结算资金（P2-E）

  market_status:
    luld_enabled: true
    max_quote_age_seconds: 60
    # 参考价来源由调用方注入（通常为前收或近 5 分钟成交均价），本系统不猜

  short:
    # disabled = 禁止一切卖空（默认，保持"禁止裸卖空"安全语义）
    # paper_only = 仅模拟盘允许；enabled = 允许（真实盘还须人工批准）
    mode: disabled
    require_operator_approval_live: true
    locate_ttl_minutes: 15

  settlement:
    # cash = 现金账户（未结算卖出款不计入购买力）
    # margin = 保证金账户（未结算可计入，倍数见 margin_multiplier）
    mode: cash
    settle_lag_days: 1
    margin_multiplier: 2.0
    tolerance: 0.01          # 与券商购买力对账差异阈值（比例）

# =============================================================================
# 本地 Paper / Replay 运行时（US-PAPER-RUNTIME）
# =============================================================================
# 设计原则：
#   * 默认 enabled: false —— 不会自动启动，必须显式 `--paper` 才会跑
#   * 与全局 us_phase2.enabled 解耦：PaperRuntime 在**自身作用域**内启用 P2 检查
#     （四个组件：market_status / short_guard / settlement / caps），
#     不修改全局开关，不影响 Web/CLI 既有行为
#   * 本阶段 short.mode 只允许 disabled（配置写错会在初始化阶段 FAILED）
#   * 只允许本地模拟盘：真实券商/真实订单/真实资金一律拒绝
# =============================================================================
paper_runtime:

  enabled: false

  # 运行目录（相对项目根）。每次运行会在此下建 run-<run_id>/
  run_root: data/paper_runs

  # 单次最长运行时间（秒）；0 = 不限（由 --minutes 控制）
  max_run_seconds: 1800

  # tick 间隔（秒）。Replay 由场景时钟推进，此值只对实时模式生效
  tick_interval_seconds: 1.0

  broker:
    initial_cash:
      USD: 100000.0
    commission_bps: 8.0
    min_commission: 3.0
    slippage_bps: 5.0

  settlement:
    currency: USD
    mode: cash
    settle_lag_days: 1

  short:
    mode: disabled

  feed:
    max_quote_age_seconds: 60
    max_idle_seconds: 120

  supervisor:
    # 健康巡检间隔（秒）
    interval_seconds: 5.0
    # 连续失败多少次触发熔断（熔断后不自动清除，必须人工 stop）
    max_consecutive_failures: 3
    # 非关键故障最多自动恢复几次
    max_auto_recoveries: 3
    # 心跳超时（秒）：超过即认为进程失联
    heartbeat_timeout_seconds: 30
