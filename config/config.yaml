      meta:

        status: VERIFIED

        source: "同上；科创板 ±20%，申报 200 股起、1 股递增"

        effective_from: "2026-07-06"

        source_tier: secondary

        note: "新股上市前 5 个交易日无涨跌幅限制，本表未按上市日区分"

    cn_st_star:

      name: "科创板（ST/*ST）"

