# =============================================================================
# 星财富 · 单 AI 自动交易系统 —— 主配置模板
# 复制为 config/config.yaml 后按需修改。密钥请勿写入本文件，
# 一律通过 .env（本地）或 DPAPI 保险箱（VPS）注入。
# =============================================================================

system:
  name: "FosunAI-Trading"
  mode: "paper"                 # paper | readonly_live | live  （默认 paper）
  timezone: "Asia/Shanghai"
  data_dir: "data"
  log_dir: "logs"

# -----------------------------------------------------------------------------
# 三重安全开关（默认全部为安全态）
#   LIVE_TRADING=true          才允许建立真实券商会话
#   ORDER_EXECUTION_ENABLED=true 才允许真实下单/撤单
#   PAPER_TRADING=true         使用本地模拟撮合
# 真实交易必须三者同时满足 + 风控放行 + kill switch 未触发
# -----------------------------------------------------------------------------
safety:
  live_trading: false
  order_execution_enabled: false
  paper_trading: true
  kill_switch: false
  # 真实交易额外必须显式确认的字符串，防止"顺手打开"
  live_ack_phrase: ""
  required_live_ack: "I UNDERSTAND REAL MONEY IS AT RISK"

markets:
  hk:  { enabled: true,  currency: "HKD", lot_default: 100 }
  us:  { enabled: true,  currency: "USD", lot_default: 1 }
  cn:  { enabled: true,  currency: "CNY", lot_default: 100 }   # A股通

universe:
  # 观察标的（格式 marketCode + stockCode，与星财富 SDK 一致）
  - { code: "hk00700", name: "腾讯控股",  market: "hk" }
  - { code: "hk09988", name: "阿里巴巴-W", market: "hk" }
  - { code: "usAAPL",  name: "Apple",     market: "us" }
  - { code: "usNVDA",  name: "NVIDIA",    market: "us" }
  - { code: "usTSLA",  name: "Tesla",     market: "us" }

ai:
  provider: "heuristic"         # heuristic | openai_compatible
  # provider=openai_compatible 时使用下列配置（DeepSeek / OpenAI / 任意兼容端点）
  openai_compatible:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    api_key_env: "AI_API_KEY"   # 只存环境变量名，不存密钥本身
    temperature: 0.2
    max_tokens: 1200
    timeout_seconds: 60
  # 模型输出强约束：任何越界结论都会被风控拒绝
  constraints:
    min_confidence: 0.60
    require_stop_loss: true
    max_position_pct: 0.15
  # ---- AI 决策权威（审计 P1-9）----
  # true = 只有真正的 AI 模型才能产生开仓信号；规则引擎只能提供指标。
  # 设为 false 等于允许"规则引擎自动交易"，与本系统定位不符，不建议。
  require_ai_for_entry: true
  # 信号有效期：超过该秒数的信号直接丢弃（防止 AI 恢复后执行失效期间的旧信号）
  signal_ttl_seconds: 300
  # 连续失败多少次后进入冷却期，以及冷却时长（冷却期内禁止新开仓）
  max_consecutive_failures: 3
  failure_cooldown_seconds: 120

risk:
  # 账户级
  max_gross_exposure_pct: 0.60      # 总持仓市值 / 净值 上限
  max_positions: 8                  # 同时持仓标的数上限
  max_position_pct: 0.15            # 单标的最大占比
  max_order_notional: 50000         # 单笔委托金额上限（账户本币）
  min_order_notional: 100           # 单笔最小金额，过滤碎单
  # 单笔风险
  risk_per_trade_pct: 0.01          # 单笔最大亏损 = 净值 * 1%
  max_stop_distance_pct: 0.12       # 止损距离过宽直接拒绝
  # 日内
  max_daily_loss_pct: 0.03          # 单日最大亏损 3%，触发即停手
  max_daily_trades: 20              # 单日成交笔数上限
  max_daily_orders: 40              # 单日委托笔数上限
  # 重复订单 / 频率
  duplicate_window_seconds: 300     # 同标的同方向冷却窗口
  max_orders_per_minute: 5
  # 订单存活时间：超过则自动撤单（0 = 关闭该功能）
  order_timeout_seconds: 600
  # 价格合理性
  max_price_deviation_pct: 0.05     # 委托价偏离最新价超过 5% 拒绝
  # 订单时间戳体检（US-P1 N-4）：超过这个偏差的历史时间戳视为异常，
  # 不计入冷却窗口并写故障告警（防止系统时钟回拨永久卡死止损）
  max_clock_skew_seconds: 300
  # 急停哨兵"写失败"时的减仓处置：
  #   block        = 一律阻断（默认，最安全）
  #   reduce_only  = 允许受限减仓（需通过持仓核实/数量限制/防反向开仓校验，且必须人工审批）
  halt_write_failure_exit_mode: "block"
  # 交易时段
  enforce_market_hours: true
  allow_short: false
  allow_margin: false

strategy:
  scan_interval_seconds: 300
  kline_ktype: "day"
  kline_num: 120
  # 均线趋势预筛（先做廉价技术过滤，再交给 AI）
  trend_filter:
    enabled: true
    fast_ma: 20
    slow_ma: 60
    min_atr_pct: 0.005

paper:
  initial_cash:
    HKD: 1000000
    USD: 130000
    CNY: 700000
  commission_bps: 8          # 万分之 8
  min_commission: 3
  slippage_bps: 5
  # 模拟撮合：限价单是否允许穿越成交
  allow_partial_fill: true

web:
  host: "127.0.0.1"
  port: 8781
  session_secret_env: "WEB_SESSION_SECRET"
  # 只读浏览口令（可选，不设则仅本机访问不鉴权）
  admin_password_env: "WEB_ADMIN_PASSWORD"

fosun:
  # 官方 SDK 网关地址，由星财富开放平台下发
  base_url: ""
  api_key_env: "FSOPENAPI_API_KEY"
  sdk_type: "ops"               # "" = /api 前缀；"ops" = /api/ops 前缀
  lang: "zhCn"
  ssl_verify: true
  # 密钥来源: env（环境变量 PEM）| vault（DPAPI 保险箱）
  key_source: "vault"
  # HTTP 超时（秒）：SDK 自己不设 timeout，由适配器在实例级注入
  http_connect_timeout: 10
  http_read_timeout: 30
  # 只读操作的重试次数（下单永不重试）
  read_retry_attempts: 2
  # 行情加密兜底：auto=POST 行情解密失败时改用官方 GET /v1/market/min；off=关闭
  market_encryption_workaround: "auto"
  sub_account_id: ""
  apply_account_id: ""
  # 美股持仓查询是否覆盖盘前/盘后/夜盘（US-P0-3）
  # 官方接口 /v1/portfolio/Holdings 的 useUsPre / useUsPost / useUsNight 三个布尔参数。
  # 默认**全部 true**：漏掉某一段就等于漏掉一段敞口（风控会以为没有持仓）。
  # 关掉任何一项都会在 health().position_sessions.warning 里显式报出来。
  position_sessions:
    use_us_pre: true
    use_us_post: true
    use_us_night: true

audit:
  db_path: "data/audit.db"
  jsonl_path: "logs/audit.jsonl"
  hash_chain: true
  retention_days: 365



# =============================================================================

# 交易规则（B4）—— 全部配置化，带来源与生效日期

#   * 涨跌幅/最小单位随板块与证券状态不同，**不要**合并成一个全局比例

#   * 规则会变（例：2026-07-06 沪深主板 ST 股涨跌幅 5% → 10%），故带 effective_from

#   * status: VERIFIED / UNVERIFIED / UNKNOWN；UNKNOWN 一律拒绝交易

#   * source_tier: primary（交易所原文）/ secondary（权威媒体转述）/ none

# =============================================================================

market_rules:

  # 两个总闸：任一为 false，规则层整体失效（配置守卫会在启动时拒绝）
  enabled: true

  enforce: true

  # 只对下列市场强制校验；未列出的市场不做规则校验，并在 status 里标注 not_modeled
  # US-P0-2：us 已纳入强制校验（价格精度/数量/时段/日历都要真正生效）。
  #          cn 保留，用于 A 股通历史回归。

  enforce_markets: ["cn", "us"]

  # 必须被强制校验的市场（启动守卫据此判定；US-P1 配置守卫）
  required_markets: ["us"]

  # 市场未纳入 enforce_markets 时的处置：
  #   warn   = 标注"未建模"后放行（历史行为，**不安全**）
  #   reject = 直接拒绝（fail-closed）
  # US-P1：已改为 reject —— 规则未建模的市场不允许交易。

  unenforced_market_policy: "reject"

  # 是否允许用 UNVERIFIED 规则交易（默认 false = 拒绝）

  allow_unverified_rules: false

  # 交易时段（US-P0-1）：**一律以交易所当地时间为准**，DST/冬令时由 zoneinfo 处理。
  # 严禁再写"北京时间 21:30-04:00"这种换算后的硬编码窗口。

  sessions:

    us:

      tz: "America/New_York"

      regular: [["09:30", "16:00"]]

      pre: ["04:00", "09:30"]

      post: ["16:00", "20:00"]

      night: ["20:00", "04:00"]     # 跨当地午夜；券商是否支持夜盘另行确认

      # 盘前/盘后/夜盘是否允许**新开仓**（false = 只在常规时段开新仓；减仓不受限）

      extended_tradable: false

    hk:

      tz: "Asia/Hong_Kong"

      regular: [["09:30", "12:00"], ["13:00", "16:00"]]

    cn:

      tz: "Asia/Shanghai"

      regular: [["09:30", "11:30"], ["13:00", "15:00"]]



  boards:

    cn_main:

      name: "沪深主板（普通股）"

      market: cn

      price_limit_pct: 0.10

      lot_size: 100

      buy_increment: 100

      sell_odd_lot: all_at_once

      t_plus: 1

      meta:

        status: VERIFIED

        source: "沪深北《交易规则(2026年修订)》2026-04-24 发布 / 2026-07-06 实施；央视网、中国经济网 2026-07-06 报道"

        effective_from: "2026-07-06"

        source_tier: secondary

        note: "二级来源，未取得交易所原文；主板普通股 ±10%"

    cn_st_main:

      name: "沪深主板（ST/*ST）"

      market: cn

      price_limit_pct: 0.10

      lot_size: 100

      buy_increment: 100

