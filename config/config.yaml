        source_tier: secondary

        note: "新股上市前 5 个交易日无涨跌幅限制，本表未按上市日区分"

    cn_st_chinext:

      name: "创业板（ST/*ST）"

      market: cn

      price_limit_pct: 0.20

      lot_size: 100

      buy_increment: 100

