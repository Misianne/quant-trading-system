      t_plus: 1

      meta:

        status: VERIFIED

        source: "同上；2026-07-06 起主板风险警示股涨跌幅由 ±5% 调整为 ±10%"

        effective_from: "2026-07-06"

        source_tier: secondary

        note: "2026-07-06 之前为 ±5%，历史回测需按日期切换"

    cn_star:

      name: "科创板（688）"

      market: cn

      price_limit_pct: 0.20

      lot_size: 200

      buy_increment: 1

