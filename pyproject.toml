[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "星财富（Fosun Wealth）单 AI 自动交易系统 —— 准备工程"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0",
    "websockets>=10.0",
    "protobuf>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ai-trader = "ai_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_trader*"]

[tool.setuptools.package-data]
"ai_trader.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: 需要外网/凭证的测试（默认跳过）",
]
