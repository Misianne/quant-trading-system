<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · FosunAI-Trading</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;
       color:#1a1d23;font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .box{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:28px 30px;
       width:340px;box-shadow:0 8px 26px rgba(16,24,40,.06)}
  h1{font-size:15px;margin:0 0 4px}
  p{color:#6b7280;font-size:12px;margin:0 0 18px}
  input{width:100%;padding:9px 11px;border:1px solid #e4e7ec;border-radius:8px;
        font-size:13px;font-family:"Cascadia Mono",Consolas,monospace}
  button{margin-top:12px;width:100%;padding:9px;border-radius:8px;border:1px solid #2f6df6;
         background:#2f6df6;color:#fff;font-size:13px;cursor:pointer}
  .err{margin-top:12px;color:#c0392b;font-size:12px}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <h1>FosunAI-Trading 管理台</h1>
  <p>请输入管理口令（WEB_ADMIN_PASSWORD）</p>
  <input type="password" name="password" placeholder="管理口令" autofocus required>
  <button type="submit">进入</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
